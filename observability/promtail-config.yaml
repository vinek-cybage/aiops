server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

# File-based scraping (not Docker/Podman socket discovery) — portable regardless
# of container runtime. Each app service dual-writes its logging.basicConfig
# output to /var/log/shared/<service>.log (same volume, mounted read-only here).
scrape_configs:
  - job_name: aiops-stack
    static_configs:
      - targets: [localhost]
        labels:
          job: aiops-stack
          __path__: /var/log/shared/*.log
