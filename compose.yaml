services:
  aiops-db:
    container_name: aiops_db
    image: postgres:17-alpine
    env_file:
      - .env
    volumes:
      - aiops-db-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10
    networks: [aiops]

  # Python (FastAPI) — incident analysis backend + frontend static files.
  aiops-api:
    build:
      context: .
      dockerfile: aiops/Dockerfile
    container_name: aiops-backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@aiops-db:5432/${POSTGRES_DB}
      - FRONTEND_DIR=/app/web
    ports:
      - "${AIOPS_API_HOST_PORT}:8000"
    volumes:
      - ~/.aws:/root/.aws:ro
    depends_on:
      aiops-db:
        condition: service_healthy
    networks: [aiops]

  # .NET (minimal API) — ingests logs/traces/metrics into the shared aiops-db.
  telemetry-api:
    build:
      context: .
      dockerfile: telemetry-api/Dockerfile
    container_name: telemetry-api
    env_file:
      - .env
    environment:
      - DATABASE_URL=Host=aiops-db;Port=5432;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=${POSTGRES_DB}
    ports:
      - "${TELEMETRY_API_HOST_PORT}:8080"
    depends_on:
      aiops-db:
        condition: service_healthy
    networks: [aiops]

volumes:
  aiops-db-data:

networks:
  aiops: