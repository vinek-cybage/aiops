services:
  aiops-db:
    container_name: aiops_db
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - aiops-db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_HOST_PORT:-3111}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10
    networks: [aiops]

  aiops-neo4j:
    image: neo4j:5-community
    container_name: aiops-neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-aiops123456}
    ports:
      - "${NEO4J_HTTP_HOST_PORT:-3112}:7474"
      - "${NEO4J_BOLT_HOST_PORT:-3113}:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      retries: 10
    networks: [aiops]

  aiops-neo4j-ssh:
    image: neo4j:5-community
    container_name: aiops-neo4j-ssh
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-aiops123456}
    ports:
      - "${NEO4J_SSH_HTTP_HOST_PORT:-3116}:7474"
      - "${NEO4J_SSH_BOLT_HOST_PORT:-3117}:7687"
    volumes:
      - neo4j-ssh-data:/data
      - neo4j-ssh-logs:/logs
      - ./data/ssh_graph_seed.cypher:/import/ssh_graph_seed.cypher:ro
      - ./neo4j/entrypoint.sh:/neo4j-entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/neo4j-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      retries: 20
    networks: [aiops]

  aiops-services:
    build:
      context: ./services/python-services
    container_name: aiops-services
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@aiops-db:5432/${POSTGRES_DB}
      - ORDERS_SERVICE_PORT=8081
      - PAYMENTS_SERVICE_URL=http://aiops-services:8081
    ports:
      - "${ORDERS_SERVICE_HOST_PORT:-3114}:8081"
    depends_on:
      aiops-db:
        condition: service_healthy
    networks: [aiops]

  log-viewer:
    build:
      context: .
    container_name: log-viewer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=aiops-db
      - POSTGRES_HOST_PORT=5432
      - NEO4J_URI=bolt://aiops-neo4j:7687
      - NEO4J_SSH_URI=bolt://aiops-neo4j-ssh:7687
      - ORDERS_SERVICE_URL=http://aiops-services:8081
    ports:
      - "${LOG_VIEWER_HOST_PORT:-3115}:8000"
    volumes:
      # NOT read-only — boto3's SSO credential provider needs to write refreshed
      # tokens back to ~/.aws/sso/cache/ periodically. With :ro, that write fails
      # (OSError: Read-only file system) and crashes the whole worker process
      # the moment a refresh is needed, taking the container down with it.
      - ~/.aws:/root/.aws
    depends_on:
      aiops-db:
        condition: service_healthy
      aiops-neo4j:
        condition: service_healthy
      aiops-neo4j-ssh:
        condition: service_healthy
    networks: [aiops]

volumes:
  aiops-db-data:
  neo4j-data:
  neo4j-logs:
  neo4j-ssh-data:
  neo4j-ssh-logs:

networks:
  aiops: