services:
  aiops-db:
    container_name: aiops_db
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - aiops-db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_HOST_PORT:-3111}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10
    networks: [aiops]

  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-aiops123456}
    ports:
      - "${NEO4J_HTTP_HOST_PORT:-3118}:7474"
      - "${NEO4J_BOLT_HOST_PORT:-3119}:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      retries: 10
    networks: [aiops]

  orders-service:
    build:
      context: ./services/python-services
    container_name: orders-service
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@aiops-db:5432/${POSTGRES_DB}
      - ORDERS_SERVICE_PORT=8081
      - PAYMENTS_SERVICE_URL=http://orders-service:8081
    ports:
      - "${ORDERS_SERVICE_HOST_PORT:-3114}:8081"
    depends_on:
      aiops-db:
        condition: service_healthy
    networks: [aiops]

  log-viewer:
    build:
      context: .
    container_name: log-viewer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=aiops-db
      - POSTGRES_HOST_PORT=5432
      - NEO4J_URI=bolt://neo4j:7687
      - ORDERS_SERVICE_URL=http://orders-service:8081
    ports:
      - "${LOG_VIEWER_HOST_PORT:-3120}:8000"
    depends_on:
      aiops-db:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks: [aiops]


volumes:
  aiops-db-data:
  neo4j-data:
  neo4j-logs:

networks:
  aiops: