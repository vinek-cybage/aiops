services:
  aiops-db:
    container_name: aiops_db
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - aiops-db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_HOST_PORT:-3111}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10
    networks: [aiops]

  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-aiops123456}
    ports:
      - "${NEO4J_HTTP_HOST_PORT:-3118}:7474"
      - "${NEO4J_BOLT_HOST_PORT:-3119}:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      retries: 10
    networks: [aiops]

  orders-service:
    build:
      context: .
      dockerfile: services/orders-service/Dockerfile
    container_name: orders-service
    env_file:
      - .env
    environment:
      - DATABASE_URL=Host=aiops-db;Port=5432;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=${POSTGRES_DB}
      - ORDERS_SERVICE_PORT=8081
      - PAYMENTS_SERVICE_HOST=payments-service
      - PAYMENTS_SERVICE_PORT=8082
    ports:
      - "${ORDERS_SERVICE_HOST_PORT:-3114}:8081"
    depends_on:
      aiops-db:
        condition: service_healthy
      # aiops-api:
      #   condition: service_healthy
    networks: [aiops]

  payments-service:
    build:
      context: .
      dockerfile: services/payments-service/Dockerfile
    container_name: payments-service
    env_file:
      - .env
    environment:
      - DATABASE_URL=Host=aiops-db;Port=5432;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=${POSTGRES_DB}
    ports:
      - "${PAYMENTS_SERVICE_HOST_PORT:-3115}:8082"
    depends_on:
      aiops-db:
        condition: service_healthy
    networks: [aiops]

  log-viewer:
    build:
      context: .
      dockerfile: log-viewer/Dockerfile
    container_name: log-viewer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=aiops-db
      - POSTGRES_HOST_PORT=5432
      - NEO4J_URI=bolt://neo4j:7687
    depends_on:
      aiops-db:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks: [aiops]

  # Standalone log-viewer UI — same incidents/metrics/graph data as
  # /api/log-viewer/* on aiops-api, served by its own small read-only API +
  # frontend (kept alongside the aiops-api integration, not a replacement).
  log-viewer-api:
    build:
      context: .
      dockerfile: log-viewer-ui/api/Dockerfile
    container_name: log-viewer-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=aiops-db
      - POSTGRES_HOST_PORT=5432
      - NEO4J_URI=bolt://neo4j:7687
    ports:
      - "${LOG_VIEWER_API_HOST_PORT:-3120}:8000"
    depends_on:
      aiops-db:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks: [aiops]

  log-viewer-web:
    build:
      context: .
      dockerfile: log-viewer-ui/web/Dockerfile
    container_name: log-viewer-web
    restart: unless-stopped
    environment:
      - VITE_API_PROXY_TARGET=http://log-viewer-api:8000
    ports:
      - "${LOG_VIEWER_WEB_HOST_PORT:-3121}:4000"
    depends_on:
      - log-viewer-api
    networks: [aiops]


volumes:
  aiops-db-data:
  neo4j-data:
  neo4j-logs:

networks:
  aiops: